<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1560" role="img" aria-labelledby="title desc">
  <title id="title">Jev 引导的分段推理流程</title>
  <desc id="desc">同一题目与种子：生成 → 评分 → 决策 → 下一段. 评分针对已经生成的文字；回退只恢复参数，不撤销文字。</desc>
  <defs>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#7fa9c7" stroke-width="1.8"/></marker>
  </defs>
  <style>
    .box { fill:#10243b; stroke:#315878; stroke-width:2; }
    .box.emphasis { fill:#10385a; stroke:#3986b5; }
    .box.jev { fill:#10334a; stroke:#25a3b7; }
    .box.decision { fill:#0b1e32; stroke:#609ac0; stroke-dasharray:6 5; }
    .box-title { fill:#e6f3ff; font:700 25px Arial,'Microsoft YaHei',sans-serif; }
    .box-title.emphasis,.box-title.jev { fill:#a5dfff; }
    .box-detail { fill:#b3c8d9; font:20px Arial,'Microsoft YaHei',sans-serif; }
    .arrow { fill:none; stroke:#7fa9c7; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .arrow.side { stroke:#607f9b; }.arrow.loop { stroke:#46afd0; stroke-width:3; }
    .tag { fill:#8bd1f4; font:700 19px Arial,'Microsoft YaHei',sans-serif; }
  </style>
  <rect width="1600" height="1560" rx="24" fill="#091522"/>
  <text x="70" y="72" fill="#e9f5ff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="44" font-weight="700">Jev 引导的分段推理流程</text>
  <text x="72" y="113" fill="#9ebbd0" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22">同一题目与种子：生成 → 评分 → 决策 → 下一段</text>
  <path d="M70 131 H1530" stroke="#315878" stroke-width="2"/>
  <path d="M470 213 H600" class="arrow " marker-end="url(#head)"/>
  <path d="M1000 213 H1130" class="arrow " marker-end="url(#head)"/>
  <path d="M1330 266 V304 H800 V334" class="arrow " marker-end="url(#head)"/>
  <path d="M800 444 V492" class="arrow " marker-end="url(#head)"/>
  <path d="M590 547 H470" class="arrow side" marker-end="url(#head)"/>
  <path d="M800 602 V655" class="arrow " marker-end="url(#head)"/>
  <path d="M590 703 H470" class="arrow side" marker-end="url(#head)"/>
  <path d="M800 751 V804" class="arrow " marker-end="url(#head)"/>
  <path d="M590 852 H510 V1009 H470" class="arrow " marker-end="url(#head)"/>
  <path d="M1010 852 H1040 V1009 H1080" class="arrow " marker-end="url(#head)"/>
  <path d="M1140 1068 V1088 H1000 V1115" class="arrow " marker-end="url(#head)"/>
  <path d="M1370 1068 V1115" class="arrow " marker-end="url(#head)"/>
  <path d="M1375 1225 V1265" class="arrow " marker-end="url(#head)"/>
  <path d="M270 1068 V1455 H590" class="arrow " marker-end="url(#head)"/>
  <path d="M1000 1225 V1360 H800 V1405" class="arrow " marker-end="url(#head)"/>
  <path d="M1530 1170 H1555 V1455 H1010" class="arrow " marker-end="url(#head)"/>
  <path d="M1375 1375 V1390 H1050 V1455 H1010" class="arrow " marker-end="url(#head)"/>
  <path d="M800 1505 V1538 H1580 V389 H1010" class="arrow loop" marker-end="url(#head)"/>
  <rect x="70" y="160" width="400" height="106" rx="20" class="box normal"/><text x="270" y="202" text-anchor="middle" class="box-title normal">读取配置与评分问题</text><text x="270" y="237" text-anchor="middle" class="box-detail">config.json · parameters.json</text>
  <rect x="600" y="160" width="400" height="106" rx="20" class="box normal"/><text x="800" y="202" text-anchor="middle" class="box-title normal">编码题目</text><text x="800" y="237" text-anchor="middle" class="box-detail">Qwen 聊天模板 · 提示词 token</text>
  <rect x="1130" y="160" width="400" height="106" rx="20" class="box normal"/><text x="1330" y="202" text-anchor="middle" class="box-title normal">初始化当前参数</text><text x="1330" y="237" text-anchor="middle" class="box-detail">从 initial 值建立采样映射</text>
  <rect x="590" y="334" width="420" height="110" rx="20" class="box emphasis"/><text x="800" y="376" text-anchor="middle" class="box-title emphasis">Qwen / vLLM 生成一段</text><text x="800" y="411" text-anchor="middle" class="box-detail">当前参数 · 累计 token · 分段预算</text>
  <rect x="590" y="492" width="420" height="110" rx="20" class="box jev"/><text x="800" y="534" text-anchor="middle" class="box-title jev">Jev 评分请求</text><text x="800" y="569" text-anchor="middle" class="box-detail">正确性 · 相关性 · 重复性 · 完整性</text>
  <rect x="70" y="492" width="400" height="110" rx="20" class="box normal"/><text x="270" y="528" text-anchor="middle" class="box-title normal">逐轮保存</text><text x="270" y="563" text-anchor="middle" class="box-detail">result.json：请求与决策</text><text x="270" y="591" text-anchor="middle" class="box-detail">answer.txt：累计答案快照</text>
  <rect x="590" y="655" width="420" height="96" rx="20" class="box decision"/><text x="800" y="691" text-anchor="middle" class="box-title decision">还能生成下一段吗？</text><text x="800" y="726" text-anchor="middle" class="box-detail">模型结束 / 可选评分停止</text><text x="800" y="754" text-anchor="middle" class="box-detail">或任一预算耗尽</text>
  <rect x="70" y="655" width="400" height="96" rx="20" class="box normal"/><text x="270" y="697" text-anchor="middle" class="box-title normal">结束本次运行</text><text x="270" y="732" text-anchor="middle" class="box-detail">保存最终状态与停止原因</text>
  <rect x="590" y="804" width="420" height="96" rx="20" class="box decision"/><text x="800" y="846" text-anchor="middle" class="box-title decision">选择实验模式</text><text x="800" y="881" text-anchor="middle" class="box-detail">两组均记录本段 Score</text>
  <rect x="70" y="950" width="400" height="118" rx="20" class="box normal"/><text x="270" y="992" text-anchor="middle" class="box-title normal">fixed：保持参数</text><text x="270" y="1027" text-anchor="middle" class="box-detail">下一段沿用当前采样设置</text>
  <rect x="1080" y="950" width="450" height="118" rx="20" class="box decision"/><text x="1305" y="992" text-anchor="middle" class="box-title decision">adaptive：先检查反馈</text><text x="1305" y="1027" text-anchor="middle" class="box-detail">上轮改动需回退？当前处于冷却期？</text>
  <rect x="850" y="1115" width="300" height="110" rx="20" class="box normal"/><text x="1000" y="1157" text-anchor="middle" class="box-title normal">恢复或保持</text><text x="1000" y="1192" text-anchor="middle" class="box-detail">回退旧参数，或等待下一轮</text>
  <rect x="1220" y="1115" width="310" height="110" rx="20" class="box jev"/><text x="1375" y="1157" text-anchor="middle" class="box-title jev">Jev 选择参数动作</text><text x="1375" y="1192" text-anchor="middle" class="box-detail">按类型给出合法 Choice</text>
  <rect x="1220" y="1265" width="310" height="110" rx="20" class="box jev"/><text x="1375" y="1301" text-anchor="middle" class="box-title jev">必要时再选具体值</text><text x="1375" y="1336" text-anchor="middle" class="box-detail">仅在需要时再次请求 Jev</text><text x="1375" y="1364" text-anchor="middle" class="box-detail">候选受边界与步长约束</text>
  <rect x="590" y="1405" width="420" height="100" rx="20" class="box emphasis"/><text x="800" y="1447" text-anchor="middle" class="box-title emphasis">准备下一段</text><text x="800" y="1482" text-anchor="middle" class="box-detail">下一轮 vLLM 请求才使用新参数</text>
  <text x="505" y="688" class="tag">否</text>
  <text x="817" y="784" class="tag">是</text>
  <text x="932" y="1097" class="tag">回退 / 冷却</text>
  <text x="1360" y="1097" class="tag">可调整</text>
  <text x="1380" y="1248" class="tag">需要选值</text>
  <text x="70" y="1540" fill="#8eaabf" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">评分针对已经生成的文字；回退只恢复参数，不撤销文字。</text>
</svg>
