<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev · 实验探索</title>
  <link rel="stylesheet" href="explorer.css">
  <script>window.JEV_TASKS = {};</script>
  <script defer src="data/batches.js"></script>
  <script defer src="batch-switch.js"></script>
  <script defer src="data/overview.js"></script>
  <script defer src="core.js"></script>
  <script defer src="tab-overview.js"></script>
  <script defer src="tab-curves.js"></script>
  <script defer src="tab-judge.js"></script>
  <script defer src="tab-tasks.js"></script>
  <script defer src="explorer.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><strong>Jev</strong><span class="bar">/</span><span data-i18n="siteTitle">实验探索</span></div>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab-btn" role="tab" data-tab="overview" data-i18n="tabOverview">总览</button>
      <button type="button" class="tab-btn" role="tab" data-tab="curves" data-i18n="tabCurves">曲线</button>
      <button type="button" class="tab-btn" role="tab" data-tab="distributions" data-i18n="tabDistributions">分布</button>
      <button type="button" class="tab-btn" role="tab" data-tab="judge" data-i18n="tabJudge">评委</button>
      <button type="button" class="tab-btn" role="tab" data-tab="behavior" data-i18n="tabBehavior">决策</button>
      <button type="button" class="tab-btn" role="tab" data-tab="tasks" data-i18n="tabTasks">任务</button>
    </nav>
    <div class="language-switch" aria-label="Language"><button id="lang-zh" type="button" lang="zh-CN" aria-pressed="true">中文</button><button id="lang-en" type="button" lang="en" aria-pressed="false">English</button></div>
  </header>
  <div class="shell">
    <aside class="side">
      <section><h4 data-i18n="sideBatch">实验批次</h4><select id="experiment-batch" aria-label="实验批次"></select><div id="dataset-count" class="side-note"></div></section>
      <section><h4 data-i18n="sideControl">对照组</h4>
        <select id="control"><option value="baseline" data-i18n="controlBaseline">Baseline · 仅 Qwen</option><option value="fixed" data-i18n="controlFixed">Fixed · Jev 评分</option></select></section>
      <section><h4 data-i18n="sideFilter">答案筛选</h4>
        <select id="grade-filter"><option value="all" data-i18n="all">全部</option><option value="improved" data-i18n="improved">Adaptive 改进</option><option value="regressed" data-i18n="regressed">Adaptive 退步</option><option value="ungraded" data-i18n="ungraded">未评分</option></select></section>
      <section><h4 data-i18n="sideSearch">搜索任务</h4><input id="search" type="search" placeholder="gsm8k_test_00[0-9]+" spellcheck="false"></section>
      <section><h4 data-i18n="sideRuns">运行</h4><div id="run-toggles" class="run-toggles"></div></section>
      <section data-for="curves distributions judge tasks"><h4 data-i18n="sideSmoothing">平滑</h4><div class="slider"><input id="smoothing" type="range" min="0" max="0.99" step="0.01" value="0"><output id="smoothing-value">0.00</output></div>
        <label class="side-check" data-for="curves distributions judge"><input id="show-band" type="checkbox"><span data-i18n="sideBand">显示 95% 范围带</span></label></section>
    </aside>
    <main id="view">
      <div class="tab" id="tab-overview" hidden></div>
      <div class="tab" id="tab-curves" hidden></div>
      <div class="tab" id="tab-distributions" hidden></div>
      <div class="tab" id="tab-judge" hidden></div>
      <div class="tab" id="tab-behavior" hidden></div>
      <div class="tab" id="tab-tasks" hidden></div>
    </main>
  </div>
  <aside id="drawer" class="drawer" hidden></aside>
</body>
</html>
